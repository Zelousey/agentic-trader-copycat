<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found — Zelos</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Zelos">
<meta name="theme-color" content="#4d3720">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="zelos-theme.css">
<script>(function(){try{if(localStorage.getItem('zelosTheme')==='black')document.documentElement.setAttribute('data-theme','black');}catch(e){}})();</script>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  body{ margin:0; }
  [hidden]{ display:none !important; }

  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.5;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;
  }
  .wrap{ width:100%; max-width:440px; text-align:center; }
  .wordmark{
    font-family:var(--mono); font-weight:700; font-size:1.05rem;
    display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:28px;
  }
  .wordmark .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .eyebrow{
    font-family:var(--mono); font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent);
  }
  h1{ font-size:1.7rem; font-weight:700; margin-top:10px; }
  p{ margin-top:12px; color:var(--muted); font-size:0.96rem; }
  .btn{
    display:inline-block; margin-top:24px; font-family:var(--sans); font-weight:700; font-size:0.95rem;
    padding:13px 22px; border-radius:3px; text-decoration:none; background:var(--accent); color:var(--accent-ink);
  }
</style>
</head>
<body class="zt">
<div class="wrap">
  <div class="wordmark"><span class="dot"></span>Zelos</div>
  <div class="eyebrow">404</div>
  <h1>That page took a wrong turn.</h1>
  <p>No qualifying page found at this link &mdash; happens more often than a broken trade setup, honestly.</p>
  <a class="btn" href="/">Back to Zelos &rarr;</a>
</div>

<script src="zelos-theme-toggle.js"></script>
</body>
</html>
